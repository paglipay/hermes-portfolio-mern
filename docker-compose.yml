services:
  mongo:
    image: mongo:6.0
    container_name: hermes_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hermes_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/portfolio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hermes_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
    driver: local
